<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Ball gradient - white to light gray for realistic look -->
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </radialGradient>

    <!-- Dark panel gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for panels -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main ball circle -->
  <circle cx="100" cy="100" r="90" fill="url(#ballGrad)" filter="url(#shadow)"/>

  <!-- Subtle stitching curves -->
  <g stroke="#cccccc" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M100,10 Q60,50 60,100 Q60,150 100,190"/>
    <path d="M100,10 Q140,50 140,100 Q140,150 100,190"/>
    <path d="M10,100 Q50,60 100,60 Q150,60 190,100"/>
    <path d="M10,100 Q50,140 100,140 Q150,140 190,100"/>
  </g>

  <!-- Pentagon panels (classic football/soccer ball pattern) -->
  <g fill="url(#panelGrad)" filter="url(#glow)">
    <!-- Center pentagon -->
    <polygon points="100,60 122,76 114,102 86,102 78,76"/>

    <!-- Top pentagon -->
    <polygon points="100,16 116,32 108,48 92,48 84,32"/>

    <!-- Top-right pentagon -->
    <polygon points="144,44 160,64 148,84 128,76 132,56"/>

    <!-- Right pentagon -->
    <polygon points="170,100 164,124 144,128 136,108 152,92"/>

    <!-- Bottom-right pentagon -->
    <polygon points="144,156 128,164 108,152 116,132 136,136"/>

    <!-- Bottom pentagon -->
    <polygon points="100,184 84,168 92,152 108,152 116,168"/>

    <!-- Bottom-left pentagon -->
    <polygon points="56,156 64,136 84,132 92,152 72,164"/>

    <!-- Left pentagon -->
    <polygon points="30,100 48,92 64,108 56,128 36,124"/>

    <!-- Top-left pentagon -->
    <polygon points="56,44 68,56 72,76 52,84 40,64"/>
  </g>

  <!-- White hexagon outlines for realism -->
  <g stroke="#e0e0e0" stroke-width="0.6" fill="none" opacity="0.3">
    <line x1="100" y1="60" x2="108" y2="48"/>
    <line x1="122" y1="76" x2="132" y2="56"/>
    <line x1="122" y1="76" x2="136" y2="108"/>
    <line x1="114" y1="102" x2="116" y2="132"/>
    <line x1="86" y1="102" x2="84" y2="132"/>
    <line x1="78" y1="76" x2="68" y2="56"/>
    <line x1="78" y1="76" x2="64" y2="108"/>
    <line x1="100" y1="60" x2="92" y2="48"/>
  </g>

  <!-- Highlight/shine for 3D effect -->
  <ellipse cx="65" cy="55" rx="28" ry="18" fill="rgba(255,255,255,0.4)" transform="rotate(-30 65 55)"/>
  <ellipse cx="52" cy="72" rx="12" ry="8" fill="rgba(255,255,255,0.2)" transform="rotate(-30 52 72)"/>
</svg>
